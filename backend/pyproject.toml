[project]
name = "nuwhere-backend"
version = "0.1.0"
description = "NUwhere moderation + AI summaries (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "better-profanity>=0.7",
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "supabase>=2.10",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
